
---
- name: To get List of API
  hosts: localhost
  gather_facts: false

  vars:
    api: "upgrade"
    ansible_verbosity: 0
    ansible_deprecation_warnings: false
    ansible_command_warnings: false
    ansible_inventory_enabled: false

  vars_files:
    - vars/avi.yml


  tasks:
    - name: Get AVI API version
      vmware.alb.avi_api_session:
        avi_credentials: "{{ avi_credentials }}"
        http_method: post
        path: "{{ api }}"
        data:
          image_uuid: "image-724fc8c6-55c1-483b-a4ec-4df3da372a93"
          system: false
          skip_warnings: false
      register: avi_get_session_output
    
    - name: Print Debug
      ansible.builtin.debug:
        msg: "API Output: {{ avi_get_session_output.obj }}"
